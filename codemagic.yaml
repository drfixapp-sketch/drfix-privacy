workflows:
  build-ios-release-ipa:
    name: "🚀 Build Dr. Fix App Store IPA (Production 1.1.4+9)"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.drfix.app
    scripts:
      - name: Configure and Fetch Flutter Dependencies
        script: |
          flutter pub get
      - name: Inject Production Environment Credentials
        script: |
          echo "==== Injecting Production Credentials into assets/app_config.env ===="
          echo "GEMINI_MODEL=gemini-3.6-flash" > assets/app_config.env
          echo "OPENROUTER_MODEL=openrouter/free" >> assets/app_config.env
          echo "AI_MODEL_ID=gemini-3.6-flash" >> assets/app_config.env
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> assets/app_config.env
          fi
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> assets/app_config.env
          fi
          echo "==== Environment Configuration Injected Successfully ===="
      - name: Set up code signing settings on Xcode project
        script: |
          echo "==== Applying Provisioning Profiles to Xcode Project ===="
          xcode-project use-profiles
      - name: Build Production iOS IPA Package
        script: |
          echo "==== Building Production iOS IPA for App Store Submission ===="
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.zip
