workflows:
  ios-ipad-screenshots-v2:
    name: "📸 Dr. Fix — iPad Pro 13-inch Screenshots NEW"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Run Integration Tests (Arabic & English)
        script: |
          mkdir -p screenshots/ar screenshots/en
          
          # جلب أول محاكي آيباد متاح مدمج في النظام
          UDID=$(xcrun simctl list devices | grep "iPad" | grep -v "unavailable" | head -1 | awk -F '[()]' '{print $2}')
          echo "Found Target iPad UDID: $UDID"
          
          xcrun simctl boot "$UDID"
          
          # 1. تشغيل واختبار اللقطات العربية
          echo "Running Arabic Tests..."
          xcrun simctl spawn "$UDID" defaults write NSGlobalDomain AppleLanguages -array ar
          xcrun simctl spawn "$UDID" defaults write NSGlobalDomain AppleLocale ar_SA
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=ar -d "$UDID"
          
          # 2. تشغيل واختبار اللقطات الإنجليزية
          echo "Running English Tests..."
          xcrun simctl spawn "$UDID" defaults write NSGlobalDomain AppleLanguages -array en
          xcrun simctl spawn "$UDID" defaults write NSGlobalDomain AppleLocale en_US
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=en -d "$UDID"
          
          xcrun simctl shutdown "$UDID"
    artifacts:
      - screenshots/**/*.png
