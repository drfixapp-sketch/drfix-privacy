workflows:
  build-ios-simulator-app:
    name: "📦 Build Dr. Fix Simulator (.app) NEW 2026"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Configure and Fetch Flutter Dependencies
        script: |
          flutter pub get
      - name: Build iOS Simulator Bundle
        script: |
          echo "==== Building iOS Bundle for Simulators ===="
          # بناء الحزمة بدون الحاجة لتوقيع رقمي (No Code Signing Required)
          flutter build ios --simulator --no-codesign
          
          echo "==== Compressing Application Bundle ===="
          # الدخول لمجلد المخرجات وضغط حزمة Runner.app بالكامل
          cd build/ios/iphonesimulator
          zip -r dr_fix_simulator.zip Runner.app
          
          # نقل الملف المضغوط إلى جذر المشروع ليتم التقاطه كـ Artifact
          mv dr_fix_simulator.zip ../../../
    artifacts:
      - dr_fix_simulator.zip
