workflows:
  ios-ipad-screenshots-v2:
    name: "📸 Dr. Fix — iPad Pro 13-inch Screenshots NEW"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Run Integration Tests (Arabic & English)
        script: |
          mkdir -p screenshots/ar screenshots/en
          
          # 1. جلب المحاكي وتشغيله
          UDID=$(xcrun simctl list devices | grep "iPad" | grep -v "unavailable" | head -1 | awk -F '[()]' '{print $2}')
          echo "Target iPad UDID: $UDID"
          xcrun simctl boot "$UDID"
          
          # [قفل 2026 الإلزامي]: الانتظار الحقيقي حتى تفتح شاشة الآيباد بالكامل ويصبح النظام مستقراً
          echo "Waiting for iPad Simulator to finish booting completely..."
          xcrun simctl bootstatus "$UDID"
          
          # 2. تشغيل واختبار اللقطات العربية
          echo "Running Arabic Tests..."
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=ar -d "$UDID"
          
          # 3. تشغيل واختبار اللقطات الإنجليزية
          echo "Running English Tests..."
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=en -d "$UDID"
          
          xcrun simctl shutdown "$UDID"
    artifacts:
      - screenshots/**/*.png
