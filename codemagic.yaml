workflows:
  ios-ipad-screenshots-v2:
    name: "📸 Dr. Fix — iPad Pro 13-inch Screenshots NEW"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Run Integration Tests (Arabic & English)
        script: |
          mkdir -p screenshots/ar screenshots/en
          
          echo "==== Step 1: Creating iPad Pro 13-inch Simulator via macOS ===="
          # إنشاء المحاكي الرسمي المعتمد لعام 2026 برمجياً وجلب معرّفه الفريد
          UDID=$(xcrun simctl create "DrFix-iPad" "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-2026" latest)
          echo "Created Device UDID: $UDID"
          
          echo "==== Step 2: Booting iOS Simulator ===="
          xcrun simctl boot "$UDID"
          
          echo "==== Step 3: Giving Simulator 15 Seconds to Stabilize ===="
          sleep 15
          
          echo "==== Step 4: Executing Arabic Integration Tests ===="
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=ar -d "$UDID"
          
          echo "==== Step 5: Executing English Integration Tests ===="
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=en -d "$UDID"
          
          xcrun simctl shutdown "$UDID"
    artifacts:
      - screenshots/**/*.png
