workflows:
  ios-ipad-screenshots-v2:
    name: "📸 Dr. Fix — iPad Pro 13-inch Screenshots NEW"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Run Integration Tests (Arabic & English)
        script: |
          mkdir -p screenshots/ar screenshots/en
          
          echo "==== Launching iPad Pro 13-inch Simulator via Flutter Engine ===="
          # إجبار محرك فلاتر على إنشاء وتشغيل محاكي آيباد متوافق مع متطلبات المتجر لعام 2026 فوراً
          flutter emulators --create --name=iPad_Pro_13
          flutter emulators --launch iPad_Pro_13
          
          # الانتظار لضمان الاستقرار الكامل
          sleep 10
          
          # تشغيل واختبار اللقطات العربية
          echo "Running Arabic Tests..."
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=ar -d ios
          
          # تشغيل واختبار اللقطات الإنجليزية
          echo "Running English Tests..."
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=en -d ios
