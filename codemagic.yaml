workflows:
  ios-real-screenshots:
    name: "📸 Dr. Fix — Real iPad Screenshots (AR + EN)"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Run Integration Tests (Arabic & English)
        script: |
          mkdir -p screenshots/ar screenshots/en
          
          echo "==== 1. Preparing Arabic iPad Pro 13-inch ===="
          UDID_AR=$(xcrun simctl create "DrFix-iPad-AR" "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-2026" latest)
          # حقن اللغة والمنطقة مباشرة في أمر الإقلاع لتفادي انهيار الأداة
          xcrun simctl boot "$UDID_AR"
          xcrun simctl spawn "$UDID_AR" defaults write NSGlobalDomain AppleLanguages -array ar
          xcrun simctl spawn "$UDID_AR" defaults write NSGlobalDomain AppleLocale ar_SA
          
          echo "Running Arabic Tests..."
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=ar -d "$UDID_AR"
          xcrun simctl shutdown "$UDID_AR"
          
          echo "==== 2. Preparing English iPad Pro 13-inch ===="
          UDID_EN=$(xcrun simctl create "DrFix-iPad-EN" "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-2026" latest)
          xcrun simctl boot "$UDID_EN"
          xcrun simctl spawn "$UDID_EN" defaults write NSGlobalDomain AppleLanguages -array en
          xcrun simctl spawn "$UDID_EN" defaults write NSGlobalDomain AppleLocale en_US
          
          echo "Running English Tests..."
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=en -d "$UDID_EN"
          xcrun simctl shutdown "$UDID_EN"
          
    artifacts:
      - screenshots/**/*.png
