workflows:
  ios-real-screenshots:
    name: "📸 Dr. Fix — Real iPad Screenshots (AR + EN)"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Boot iPad Pro 13-inch Simulator
        script: |
          echo "Creating a fresh iPad Pro 13-inch simulator for 2026..."
          # إنشاء جهاز مخصص وحفظ المعرف الخاص به مباشرة في ملف نصي لتفادي أخطاء القص والفرز
          xcrun simctl create "DrFix-iPad-13" "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-2026" latest > sim_udid.txt
          UDID=$(cat sim_udid.txt)
          echo "Target Device UDID: $UDID"
          xcrun simctl boot "$UDID"
          echo "Simulator Booted Successfully."
      - name: Run Integration Tests (Arabic & English)
        script: |
          mkdir -p screenshots/ar screenshots/en
          UDID=$(cat sim_udid.txt)
          
          # 1. لقطات الشاشة العربية
          echo "Configuring Simulator to Arabic..."
          xcrun simctl configure "$UDID" --locale ar --language ar
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=ar -d "$UDID"
          
          # 2. لقطات الشاشة الإنجليزية
          echo "Configuring Simulator to English..."
          xcrun simctl configure "$UDID" --locale en --language en
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=en -d "$UDID"
    artifacts:
      - screenshots/**/*.png
