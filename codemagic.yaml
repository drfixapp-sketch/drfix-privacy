workflows:
  ios-real-screenshots:
    name: "📸 Dr. Fix — Real iPad Screenshots (AR + EN)"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Boot iPad Pro 13-inch Simulator
        script: |
          UDID=$(xcrun simctl list devices | grep "iPad Pro 13-inch" | grep -v "unavailable" | head -1 | awk -F '[()]' '{print $2}')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl create "iPad Pro 13-inch" "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-2026" latest)
          fi
          echo "Booting Device UDID: $UDID"
          xcrun simctl boot "$UDID"
      - name: Run Integration Tests (Arabic & English)
        script: |
          mkdir -p screenshots/ar screenshots/en
          UDID=$(xcrun simctl list devices | grep "iPad Pro 13-inch" | grep "Booted" | head -1 | awk -F '[()]' '{print $2}')
          
          # التقاط الشاشات العربية أولاً
          xcrun simctl configure "$UDID" --locale ar --language ar
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=ar -d "$UDID"
          
          # تحويل اللغة والتقاط الشاشات الإنجليزية
          xcrun simctl configure "$UDID" --locale en --language en
          flutter test integration_test/screenshot_test.dart --dart-define=LOCALE=en -d "$UDID"
    artifacts:
      - screenshots/**/*.png
