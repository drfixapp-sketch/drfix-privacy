<html lang="ar" dir="rtl">
<head>

  <!-- Favicon (inline SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231565C0'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='18' font-weight='bold' font-family='Arial' fill='white'%3EDf%3C/text%3E%3C/svg%3E">

  <style>
    /* ══ CSS CUSTOM PROPERTIES ══ */
    :root {
      --clr-primary:      #1565C0;
      --clr-primary-d:    #0D47A1;
      --clr-secondary:    #1E88E5;
      --clr-secondary-l:  #42A5F5;
      --clr-accent:       #E8F1FD;
      --clr-bg:           #F7F9FC;
      --clr-white:        #FFFFFF;
      --clr-text:         #1A2332;
      --clr-muted:        #546E8A;
      --clr-border:       #DDE4EE;
      --clr-warn-bg:      #FFFBEB;
      --clr-warn-border:  #F59E0B;
      --clr-success:      #166534;
      --shadow-xs: 0 1px 3px rgba(21,101,192,.07);
      --shadow-sm: 0 2px 8px rgba(21,101,192,.10);
      --shadow-md: 0 6px 20px rgba(21,101,192,.13);
      --shadow-lg: 0 12px 40px rgba(21,101,192,.18);
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-xl: 26px;
      --ease: 0.22s cubic-bezier(.4,0,.2,1);
    }

    /* ══ RESET ══ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      background: var(--clr-bg);
      color: var(--clr-text);
      line-height: 1.8;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body.ltr { direction: ltr; text-align: left; }
    body.rtl { direction: rtl; text-align: right; }

    /* Offset for sticky header */
    [id] { scroll-margin-top: 84px; }

    /* ══ SKIP LINK ══ */
    .skip-link {
      position: absolute; top: -120px; inset-inline-start: 16px;
      background: var(--clr-primary); color: var(--clr-white);
      padding: 8px 16px;
      border-radius: 0 0 var(--r-sm) var(--r-sm);
      font-size: .9rem; font-weight: 600;
      text-decoration: none; z-index: 9999;
      transition: top .2s;
    }
    .skip-link:focus { top: 0; }

    /* ══ HEADER ══ */
    .site-header {
      background: linear-gradient(135deg, var(--clr-primary-d) 0%, var(--clr-primary) 55%, var(--clr-secondary) 100%);
      color: var(--clr-white);
      position: sticky; top: 0; z-index: 100;
      box-shadow: var(--shadow-lg);
    }
    .hdr-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 36px; gap: 14px; flex-wrap: wrap;
    }
    .hdr-brand { display: flex; align-items: center; gap: 14px; }
    .brand-logo {
      width: 46px; height: 46px; flex-shrink: 0;
      background: rgba(255,255,255,.16);
      border: 2px solid rgba(255,255,255,.32);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: var(--clr-white);
      letter-spacing: -1px; user-select: none;
    }
    .brand-title { display: block; font-size: 1.22rem; font-weight: 800; line-height: 1.2; letter-spacing: .3px; }
    .brand-sub   { display: block; font-size: .77rem; opacity: .8; margin-top: 1px; }
    .hdr-nav { display: flex; align-items: center; gap: 8px; }
    .btn-lang {
      display: inline-flex; align-items: center;
      padding: 7px 15px;
      border-radius: var(--r-md);
      font-size: .83rem; font-weight: 700; letter-spacing: .3px;
      cursor: pointer;
      background: rgba(255,255,255,.18);
      color: var(--clr-white);
      border: 1.5px solid rgba(255,255,255,.38);
      transition: background var(--ease), box-shadow var(--ease);
    }
    .btn-lang:hover        { background: rgba(255,255,255,.32); }
    .btn-lang:focus-visible{ outline: 2px solid #fff; outline-offset: 2px; border-radius: var(--r-md); }
    .btn-lang.is-active    { background: #fff; color: var(--clr-primary); border-color: #fff; box-shadow: var(--shadow-sm); }
    .lang-pipe { color: rgba(255,255,255,.4); user-select: none; padding: 0 2px; }
    .hdr-sub {
      background: rgba(0,0,0,.14);
      padding: 7px 36px;
      font-size: .79rem;
      opacity: .88;
    }

    /* ══ PAGE WRAPPER ══ */
    .page-wrap { max-width: 980px; margin: 0 auto; padding: 36px 24px 96px; }

    /* ══ TOOLBAR ══ */
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
    .btn-tool {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 18px;
      border-radius: var(--r-md);
      font-size: .84rem; font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--clr-border);
      background: var(--clr-white);
      color: var(--clr-text);
      box-shadow: var(--shadow-xs);
      transition: background var(--ease), color var(--ease), border-color var(--ease),
                  box-shadow var(--ease), transform var(--ease);
    }
    .btn-tool svg { width: 15px; height: 15px; flex-shrink: 0; }
    .btn-tool:hover {
      background: var(--clr-primary); color: #fff;
      border-color: var(--clr-primary); box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }
    .btn-tool:focus-visible { outline: 2px solid var(--clr-primary); outline-offset: 2px; }
    .btn-tool:active { transform: none; }
    .btn-tool.is-copied { background: var(--clr-success); color: #fff; border-color: var(--clr-success); }

    /* ══ TOC ══ */
    .toc-wrap {
      background: var(--clr-white);
      border: 1px solid var(--clr-border);
      border-radius: var(--r-xl);
      padding: 26px 30px;
      margin-bottom: 30px;
      box-shadow: var(--shadow-md);
      position: relative; overflow: hidden;
    }
    .toc-wrap::after {
      content: '';
      position: absolute; top: 0; inset-inline-start: 0;
      width: 5px; height: 100%;
      background: linear-gradient(180deg, var(--clr-primary), var(--clr-secondary));
    }
    .toc-label {
      font-size: 1rem; font-weight: 700; color: var(--clr-primary);
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 9px;
    }
    .toc-label svg { width: 19px; height: 19px; flex-shrink: 0; }
    .toc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(192px, 1fr));
      gap: 7px;
    }
    .toc-link {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 13px;
      border-radius: var(--r-sm);
      background: var(--clr-bg);
      color: var(--clr-text);
      text-decoration: none;
      font-size: .86rem; font-weight: 500;
      border: 1px solid var(--clr-border);
      line-height: 1.4;
      transition: background var(--ease), color var(--ease),
                  border-color var(--ease), transform var(--ease), box-shadow var(--ease);
    }
    .toc-link:hover {
      background: var(--clr-primary); color: #fff;
      border-color: var(--clr-primary);
      transform: translateY(-1px); box-shadow: var(--shadow-xs);
    }
    .toc-link:focus-visible { outline: 2px solid var(--clr-primary); outline-offset: 2px; }
    .toc-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px;
      background: var(--clr-primary); color: #fff;
      border-radius: 50%;
      font-size: .67rem; font-weight: 800; flex-shrink: 0;
      transition: background var(--ease);
    }
    .toc-link:hover .toc-badge { background: rgba(255,255,255,.28); }

    /* ══ ACCORDION ══ */
    .sec-card {
      background: var(--clr-white);
      border: 1px solid var(--clr-border);
      border-radius: var(--r-lg);
      margin-bottom: 12px;
      box-shadow: var(--shadow-xs);
      overflow: hidden;
      transition: box-shadow var(--ease), border-color var(--ease);
    }
    .sec-card:hover     { box-shadow: var(--shadow-sm); }
    .sec-card.is-open   { box-shadow: var(--shadow-md); border-color: #C3D8F4; }

    .sec-trigger {
      width: 100%; background: transparent; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 26px; gap: 12px; text-align: inherit;
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      transition: background var(--ease);
    }
    .sec-trigger:hover       { background: #F0F6FF; }
    .sec-trigger:focus-visible{ outline: 2px solid var(--clr-secondary); outline-offset: -2px; border-radius: var(--r-lg); }
    .sec-card.is-open .sec-trigger { background: #E9F2FF; }

    .trig-left { display: flex; align-items: center; gap: 13px; flex: 1; min-width: 0; }
    .sec-badge {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-secondary));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: .82rem; font-weight: 800;
      transition: transform var(--ease);
    }
    .sec-card.is-open .sec-badge { transform: scale(1.08); }
    .sec-name {
      font-size: .97rem; font-weight: 700; color: var(--clr-text); line-height: 1.35;
    }
    .chev {
      width: 22px; height: 22px; flex-shrink: 0;
      color: var(--clr-muted);
      transition: transform var(--ease), color var(--ease);
    }
    .sec-card.is-open .chev { transform: rotate(180deg); color: var(--clr-primary); }

    .sec-panel {
      max-height: 0; overflow: hidden;
      transition: max-height .36s cubic-bezier(.4,0,.2,1);
    }
    .panel-inner { padding: 4px 26px 28px; }

    /* ══ CONTENT ══ */
    .acc-body p               { margin-bottom: 13px; line-height: 1.8; }
    .acc-body p:last-child    { margin-bottom: 0; }
    .acc-body strong          { color: var(--clr-primary-d); font-weight: 700; }
    .acc-body ul,
    .acc-body ol              { padding-inline-start: 22px; margin-bottom: 13px; }
    .acc-body li              { margin-bottom: 7px; line-height: 1.75; }
    .acc-body h3 {
      font-size: .93rem; font-weight: 700; color: var(--clr-primary);
      margin: 22px 0 10px;
      padding-inline-start: 11px;
      border-inline-start: 3px solid var(--clr-secondary);
      line-height: 1.4;
    }
    .acc-body blockquote {
      background: var(--clr-accent);
      border-inline-start: 4px solid var(--clr-secondary);
      border-radius: var(--r-sm);
      padding: 12px 16px; margin: 13px 0;
      font-size: .91rem; color: var(--clr-primary-d); font-style: normal;
    }
    .acc-body .warn-box {
      background: var(--clr-warn-bg);
      border: 1.5px solid var(--clr-warn-border);
      border-radius: var(--r-sm);
      padding: 14px 18px; margin: 14px 0;
      font-size: .91rem; line-height: 1.75;
    }
    .acc-body a {
      color: var(--clr-secondary); word-break: break-all;
      text-underline-offset: 2px;
    }
    .acc-body a:hover        { color: var(--clr-primary); text-decoration: underline; }
    .acc-body a:focus-visible{ outline: 2px solid var(--clr-primary); border-radius: 2px; }

    /* TABLE */
    .tbl-wrap  { overflow-x: auto; margin: 14px 0; border-radius: var(--r-sm); }
    .data-tbl  {
      width: 100%; min-width: 420px;
      border-collapse: collapse; font-size: .87rem;
    }
    .data-tbl th {
      background: linear-gradient(90deg, var(--clr-primary), var(--clr-secondary));
      color: #fff; padding: 12px 16px;
      text-align: inherit; font-weight: 700; white-space: nowrap;
    }
    .data-tbl td { padding: 10px 16px; border-bottom: 1px solid var(--clr-border); vertical-align: top; }
    .data-tbl tr:last-child td { border-bottom: none; }
    .data-tbl tr:nth-child(even) td { background: var(--clr-bg); }
    .data-tbl tr:hover td { background: var(--clr-accent); }

    /* DISCLAIMER LIST */
    .disc-list { list-style: none; padding: 0; margin: 4px 0 16px; }
    .disc-list li {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 13px 0; border-bottom: 1px solid var(--clr-border);
    }
    .disc-list li:last-child { border-bottom: none; }
    .disc-n {
      min-width: 28px; height: 28px; flex-shrink: 0;
      background: var(--clr-primary); color: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 800; margin-top: 1px;
    }

    /* ══ BACK TO TOP ══ */
    #btn-top {
      position: fixed; bottom: 28px; inset-inline-start: 24px;
      width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-secondary));
      color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md); z-index: 99;
      opacity: 0; pointer-events: none;
      transition: opacity var(--ease), transform var(--ease), box-shadow var(--ease);
    }
    #btn-top.show        { opacity: 1; pointer-events: auto; }
    #btn-top:hover       { transform: translateY(-3px) scale(1.08); box-shadow: var(--shadow-lg); }
    #btn-top:focus-visible{ outline: 2px solid #fff; outline-offset: 2px; }
    #btn-top svg { width: 20px; height: 20px; }

    /* ══ FOOTER ══ */
    .site-footer {
      background: var(--clr-primary-d);
      color: rgba(255,255,255,.82);
      text-align: center;
      padding: 22px 20px;
      font-size: .87rem; line-height: 1.7;
    }
    .site-footer a { color: var(--clr-secondary-l); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; color: #fff; }

    /* ══ RESPONSIVE: Tablet ══ */
    @media (max-width: 768px) {
      .hdr-top   { padding: 12px 20px; }
      .hdr-sub   { padding: 6px 20px; }
      .page-wrap { padding: 24px 16px 80px; }
      .toc-wrap  { padding: 20px; }
      .toc-grid  { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); }
      .sec-trigger, .panel-inner { padding-inline: 18px; }
    }

    /* ══ RESPONSIVE: Mobile ══ */
    @media (max-width: 480px) {
      .hdr-top   { padding: 10px 14px; gap: 10px; }
      .hdr-sub   { padding: 5px 14px; }
      .brand-logo { width: 40px; height: 40px; font-size: 16px; }
      .brand-title{ font-size: 1.02rem; }
      .page-wrap { padding: 16px 12px 68px; }
      .toc-wrap  { padding: 16px 14px; border-radius: var(--r-lg); }
      .toc-grid  { grid-template-columns: 1fr 1fr; gap: 5px; }
      .toc-link  { padding: 8px 9px; font-size: .82rem; }
      .sec-name  { font-size: .9rem; }
      .sec-trigger{ padding: 15px 14px; }
      .panel-inner{ padding: 4px 14px 22px; }
      .btn-tool  { padding: 8px 12px; font-size: .8rem; }
      .toolbar   { gap: 6px; }
    }

    /* ══ PRINT ══ */
    @media print {
      .site-header, .toolbar, #btn-top, .site-footer,
      .toc-wrap, .skip-link { display: none !important; }
      body { background: #fff; color: #000; }
      .sec-card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; margin-bottom: 8px; }
      .sec-panel { max-height: none !important; overflow: visible !important; }
      .chev, .sec-badge { display: none; }
      .sec-trigger { background: #f3f3f3 !important; pointer-events: none; }
      .tbl-wrap { overflow: visible; }
      .data-tbl { min-width: unset; }
    }

    /* ══ REDUCED MOTION ══ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body class="rtl">

<!-- Skip Navigation -->
<a class="skip-link" href="#main-content">تخطي للمحتوى | Skip to main content</a>

<!-- Back to Top -->
<button id="btn-top" aria-label="العودة للأعلى">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</button>

<!-- HEADER -->
<header class="site-header" role="banner" id="page-top">
  <div class="hdr-top">
    <div class="hdr-brand">
      <div class="brand-logo" aria-hidden="true">Df</div>
      <div>
        <span class="brand-title" id="hdr-title">سياسة الخصوصية</span>
        <span class="brand-sub"   id="hdr-sub">تطبيق Dr. Fix</span>
      </div>
    </div>
    <nav class="hdr-nav" id="lang-nav" aria-label="اختيار اللغة">
      <button class="btn-lang is-active" id="btn-ar"
        onclick="setLang('ar')" aria-pressed="true" lang="ar">العربية</button>
      <span class="lang-pipe" aria-hidden="true">|</span>
      <button class="btn-lang" id="btn-en"
        onclick="setLang('en')" aria-pressed="false" lang="en">English</button>
    </nav>
  </div>
  <p class="hdr-sub"><span id="hdr-updated">آخر تحديث: أغسطس 2026</span></p>
</header>

<!-- MAIN -->
<main class="page-wrap" id="main-content" role="main">

  <!-- TOOLBAR -->
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="أدوات الصفحة">
    <button class="btn-tool" id="btn-print" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      <span id="t-print">طباعة</span>
    </button>
    <button class="btn-tool" id="btn-copy" onclick="doCopy(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span id="t-copy">نسخ الرابط</span>
    </button>
    <button class="btn-tool" id="btn-expand" onclick="expandAll()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      <span id="t-expand">توسيع الكل</span>
    </button>
    <button class="btn-tool" id="btn-collapse" onclick="collapseAll()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
      <span id="t-collapse">طي الكل</span>
    </button>
  </div>

  <!-- TABLE OF CONTENTS -->
  <nav class="toc-wrap" id="toc" aria-labelledby="toc-lbl">
    <div class="toc-label">

    { id:'s1', n:1, title:'1. Introduction', html:`
      <p><strong>Dr. Fix</strong> is an intelligent assistant specialized in diagnosing mechanical, electrical, and industrial faults in technical equipment and devices. The app analyzes fault descriptions and user-provided data to generate AI-powered diagnostic suggestions, alongside preventative maintenance guidance and a specialized technical community.</p>

    { id:'s2', n:2, title:'2. Data We Collect', html:`
      <h3>a. Diagnostic Input Data</h3>

    { id:'s4', n:4, title:'4. Third-Party Services Used', html:`

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   STATE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let lang = 'ar';

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RENDER
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function render(l) {
  lang = l;
  const u = UI[l], ss = DATA[l], rtl = (l === 'ar');

  document.documentElement.lang = l;
  document.documentElement.dir  = rtl ? 'rtl' : 'ltr';
  document.body.className        = rtl ? 'rtl' : 'ltr';
  document.title                 = u.title + ' — Dr. Fix';

  /* header */
  document.getElementById('hdr-title').textContent   = u.title;
  document.getElementById('hdr-sub').textContent     = u.sub;
  document.getElementById('hdr-updated').textContent = u.updated;

  /* lang buttons */
  ['ar','en'].forEach(x => {
    const b = document.getElementById('btn-' + x);
    const on = (x === l);
    b.className = 'btn-lang' + (on ? ' is-active' : '');
    b.setAttribute('aria-pressed', String(on));
  });

  /* toolbar labels */
  document.getElementById('t-print').textContent    = u.print;
  document.getElementById('t-copy').textContent     = u.copy;
  document.getElementById('t-expand').textContent   = u.expand;
  document.getElementById('t-collapse').textContent = u.collapse;
  document.getElementById('toolbar').setAttribute('aria-label', u.toolbar);
  document.getElementById('lang-nav').setAttribute('aria-label', u.langNav);
  document.getElementById('btn-top').setAttribute('aria-label', u.backTop);

  /* TOC */
  document.getElementById('toc-lbl').textContent = u.toc;
  document.getElementById('toc').setAttribute('aria-label', u.toc);
  document.getElementById('toc-grid').innerHTML = ss.map(s => `
    <div role="listitem">
      <a class="toc-link" href="#${s.id}" onclick="openSec('${s.id}')">
        <span class="toc-badge" aria-hidden="true">${s.n}</span>
        <span>${s.title}</span>
      </a>
    </div>`).join('');

  /* sections */
  document.getElementById('sections').innerHTML = ss.map(s => `
    <article class="sec-card" id="${s.id}">
      <button class="sec-trigger"
        id="trig-${s.id}"
        aria-expanded="false"
        aria-controls="panel-${s.id}">
        <span class="trig-left">
          <span class="sec-badge" aria-hidden="true">${s.n}</span>
          <span class="sec-name">${s.title}</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="sec-panel" id="panel-${s.id}" role="region" aria-labelledby="trig-${s.id}">
        <div class="panel-inner"><div class="acc-body">${s.html}</div></div>
      </div>
    </article>`).join('');

  /* bind click events */
  ss.forEach(s => {
    document.getElementById('trig-' + s.id)
      .addEventListener('click', () => toggleSec(s.id));
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ACCORDION (max-height technique)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function measurePanel(panel) {
  const saved = panel.style.maxHeight;
  panel.style.maxHeight = 'none';
  const h = panel.scrollHeight;
  panel.style.maxHeight = saved;
  return h;
}

function openSec(id) {
  const card  = document.getElementById(id);
  const trig  = document.getElementById('trig-' + id);
  const panel = document.getElementById('panel-' + id);
  if (!card.classList.contains('is-open')) {
    card.classList.add('is-open');
    trig.setAttribute('aria-expanded', 'true');
    panel.style.maxHeight = measurePanel(panel) + 'px';
  }
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
}

function toggleSec(id) {
  const card  = document.getElementById(id);
  const trig  = document.getElementById('trig-' + id);
  const panel = document.getElementById('panel-' + id);
  const open  = card.classList.contains('is-open');
  card.classList.toggle('is-open', !open);
  trig.setAttribute('aria-expanded', String(!open));
  panel.style.maxHeight = open ? '0' : measurePanel(panel) + 'px';
}

function expandAll() {
  DATA[lang].forEach(s => {
    const card  = document.getElementById(s.id);
    const trig  = document.getElementById('trig-' + s.id);
    const panel = document.getElementById('panel-' + s.id);
    if (card && !card.classList.contains('is-open')) {
      card.classList.add('is-open');
      trig.setAttribute('aria-expanded', 'true');
      panel.style.maxHeight = measurePanel(panel) + 'px';
    }
  });
}

function collapseAll() {
  DATA[lang].forEach(s => {
    const card  = document.getElementById(s.id);
    const trig  = document.getElementById('trig-' + s.id);
    const panel = document.getElementById('panel-' + s.id);
    if (card && card.classList.contains('is-open')) {
      card.classList.remove('is-open');
      trig.setAttribute('aria-expanded', 'false');
      panel.style.maxHeight = '0';
    }
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   LANGUAGE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function setLang(l) { render(l); handleHash(); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   COPY LINK
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function doCopy(btn) {
  const span = btn.querySelector('span');
  const u    = UI[lang];
  const ok   = () => {
    btn.classList.add('is-copied');
    span.textContent = u.copied;
    setTimeout(() => { btn.classList.remove('is-copied'); span.textContent = u.copy; }, 2200);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(location.href).then(ok).catch(() => fbCopy(ok));
  } else { fbCopy(ok); }
}
function fbCopy(cb) {
  const ta = document.createElement('textarea');
  ta.value = location.href;
  ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e) {}
  document.body.removeChild(ta);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   BACK TO TOP
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const btnTop = document.getElementById('btn-top');
window.addEventListener('scroll', () => {
  btnTop.classList.toggle('show', window.scrollY > 320);
}, { passive: true });
btnTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HASH / KEYBOARD
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function handleHash() {
  const id = location.hash.replace('#','');
  if (id && document.getElementById(id)) {
    setTimeout(() => openSec(id), 80);
  }
}
window.addEventListener('hashchange', handleHash);

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const el = document.activeElement;
  if (!el || !el.classList.contains('sec-trigger')) return;
  const card = el.closest('.sec-card');
  if (card && card.classList.contains('is-open')) {
    toggleSec(card.id); el.focus();
  }
});

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   INIT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
render('ar');
handleHash();
</script>
